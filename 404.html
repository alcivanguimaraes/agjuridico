<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AG Jurídico Estratégico</title>
    <script>
      // Redirecionar URLs sem hash para URLs com hash
      (function() {
        var pathname = window.location.pathname;
        var search = window.location.search;
        
        // Se a URL não é a raiz, redirecionar para hash-based routing
        if (pathname !== '/' && pathname !== '/index.html') {
          // Redirecionar para /#<pathname><search>
          window.location.replace('/#' + pathname + search);
        }
      })();
    </script>
  </head>
  <body>
  </body>
</html>
